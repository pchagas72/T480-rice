[font]
size = 18

[font.normal]
family = "Scientifica"
style = "Regular"

[scrolling]
history = 10000

[window]
opacity = 1
title = "Alacritty"

[window.padding]
x = 9
y = 9

# Catppuccin Mocha color scheme
[colors.primary]
background = '#1e1e2e' # Base
foreground = '#cdd6f4' # Text

[colors.cursor]
text = '#1e1e2e'       # Base
cursor = '#f5e0dc'     # Rosewater

[colors.normal]
black   = '#45475a' # Surface1
red     = '#f38ba8' # Red
green   = '#a6e3a1' # Green
yellow  = '#f9e2af' # Yellow
blue    = '#89b4fa' # Blue
magenta = '#cba6f7' # Mauve
cyan    = '#94e2d5' # Teal
white   = '#bac2de' # Subtext1

[colors.bright]
black   = '#585b70' # Surface2
red     = '#f38ba8' # Red
green   = '#a6e3a1' # Green
yellow  = '#f9e2af' # Yellow
blue    = '#89b4fa' # Blue
magenta = '#cba6f7' # Mauve
cyan    = '#94e2d5' # Teal
white   = '#a6adc8' # Subtext0
